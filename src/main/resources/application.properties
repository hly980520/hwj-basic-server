### BOF Admin Service Dubbo
##对应ApplicationConfig Dubbo应用配置
#dubbo.application.name=hwj-basic-server
#dubbo.application.owner=com.hwj.basic.server
#dubbo.application.organization=hwj
#dubbo.application.logger=slf4j
#dubbo.application.compiler=javassist
#
##对应ConfigCenterConfig Dubbo内置配置中心
#dubbo.config-center.address=nacos://127.0.0.1:8848?namespace=namespace-dubbo-hwj
#
##对应RegistryConfig Dubbo注册中心
#dubbo.registries.registry-hwj.id=registry-hwj
#dubbo.registries.registry-hwj.address=nacos://127.0.0.1:8848?namespace=namespace-dubbo-hwj
#dubbo.registries.registry-hwj.group=dubbo-hwj
#dubbo.registries.registry-hwj.session=60000
#dubbo.registries.registry-hwj.register=true
#dubbo.registries.registry-hwj.subscribe=true
#dubbo.registries.registry-hwj.check=true
#
##对应ProtocolConfig Dubbo协议配置，服务提供者需配置，消费者不需要
#dubbo.protocols.protocol-hwj-basic-server.id=protocol-hwj-basic-server
#dubbo.protocols.protocol-hwj-basic-server.name=dubbo
#dubbo.protocols.protocol-hwj-basic-server.dispatcher=message
#dubbo.protocols.protocol-hwj-basic-server.threadpool=limited
#
##对应ProviderConfig Dubbo服务器提供这配置，本质上是DubboService的公共配置
#dubbo.providers.provider-hwj-basic-server.protocolIds=protocol-hwj-basic-server
#dubbo.providers.provider-hwj-basic-server.registryIds=registry-hwj
#dubbo.providers.provider-hwj-basic-server.cluster=failover
#dubbo.providers.provider-hwj-basic-server.loadbalance=leastactive
#dubbo.providers.provider-hwj-basic-server.serialization=hessian2
#dubbo.providers.provider-hwj-basic-server.retries=0
#dubbo.providers.provider-hwj-basic-server.timeout=3000
#dubbo.providers.provider-hwj-basic-server.proxy=javassist
#dubbo.providers.provider-hwj-basic-server.delay=-1
#dubbo.providers.provider-hwj-basic-server.group=hwj-basic-server
#dubbo.protocols.protocol-hwj-basic-server.threads=200
